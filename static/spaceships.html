<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Airgap spaceships</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="viewfinder">
    <video id="camera" class="camera" hidden></video>
    <header class="vf-head">
      <h1><a href="./">Airgap</a></h1>
      <details id="menu" class="vf-menu">
        <summary class="vf-gear" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </summary>
        <div id="settings" class="card vf-settings">
          <span class="label">Send moves by</span>
          <label class="check"><input id="chirp" type="checkbox" checked />
        chirp</label>
          <label class="check"><input id="qrcode" type="checkbox" />
        qrcode</label>
          <label>Chirp protocol
        <select id="protocol">
          <option value="ultrasound-fastest">ultrasound fastest</option>
          <option value="ultrasound-fast">ultrasound fast</option>
          <option value="ultrasound-normal">ultrasound normal</option>
          <option value="fastest">fastest</option>
          <option value="fast">fast</option>
          <option value="normal">normal</option>
        </select>
      </label>
          <label>Chirp passes per move
        <input
          id="passes"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          min="1"
          max="20"
          value="1"
        />
      </label>
        </div>
      </details>
    </header>
    <div class="vf-status vf-top">
      <span id="dot" class="dot"></span>
      <span id="status" class="mono">ready</span>
    </div>
    <div class="vf-middle">
      <div id="big" class="card sector" role="group" aria-label="Sector">
        <span class="sector-label label">Your sector <span class="mono"
          ></span></span>
        <canvas
          id="code"
          class="board-code"
          aria-label="This move as a QR code; tap to see the sector"
          hidden
        ></canvas>
      </div>
      <div class="row">
        <button id="small" class="card" aria-label="Swap sectors" hidden>
          <span class="sector small">
            <span class="sector-label label">Yours
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M8 3 4 7l4 4"></path>
                <path d="M4 7h16"></path>
                <path d="m16 13 4 4-4 4"></path>
                <path d="M20 17H4"></path>
              </svg></span>
          </span>
        </button>
        <div id="chips" class="chips" role="group" aria-label="Ships">
          <button class="chip">Carrier <span class="mono">5</span></button>
          <button class="chip">Battleship <span class="mono">4</span></button>
          <button class="chip">Cruiser <span class="mono">3</span></button>
          <button class="chip">Submarine <span class="mono">3</span></button>
          <button class="chip">Destroyer <span class="mono">2</span></button>
        </div>
        <div class="stack">
          <button id="shuffle">Shuffle</button>
          <button id="start" class="tx">Start</button>
          <button id="fire" class="tx" hidden disabled>Fire</button>
          <button id="ping" hidden disabled>Ping</button>
        </div>
      </div>
      <div id="again" class="row" hidden>
        <button id="switch" class="tx">Switch sides</button>
        <button id="replay">Replay</button>
      </div>
    </div>
    <footer class="vf-foot">
      <details>
        <summary class="mono muted">Log</summary>
        <pre id="log" class="log"></pre>
      </details>
    </footer>
    <script type="module" src="./spaceships.js"></script>
  </body>
</html>
