<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Airgap Packet Storm</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="viewfinder">
    <video id="camera" class="camera" hidden></video>
    <header class="vf-head">
      <h1><a href="./">Airgap</a></h1>
      <details id="menu" class="vf-menu">
        <summary class="vf-gear" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </summary>
        <div id="settings" class="card vf-settings">
          <span class="label">Send moves by</span>
          <label class="check"><input id="chirp" type="checkbox" checked />
        chirp</label>
          <label class="check"><input id="qrcode" type="checkbox" />
        qrcode</label>
          <label>Chirp protocol
        <select id="protocol">
          <option value="ultrasound-fastest">ultrasound fastest</option>
          <option value="ultrasound-fast">ultrasound fast</option>
          <option value="ultrasound-normal">ultrasound normal</option>
          <option value="fastest">fastest</option>
          <option value="fast">fast</option>
          <option value="normal">normal</option>
        </select>
      </label>
          <label>Chirp passes per move
        <input
          id="passes"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          min="1"
          max="20"
          value="1"
        />
      </label>
          <button id="share" hidden>Share game</button>
        </div>
      </details>
    </header>
    <div class="vf-status vf-top">
      <span id="dot" class="dot"></span>
      <span id="status" class="mono">ready</span>
    </div>
    <div class="vf-middle">
      <button id="start" class="tx">Start</button>
      <div class="storm-hud">
        <div class="storm-hp x">
          <span class="label">Host <span id="host-you"></span></span>
          <div class="storm-bar"><i id="host-bar"></i></div>
          <span id="host-hp" class="mono">100</span>
        </div>
        <div class="storm-wind">
          <span class="label">Wind</span>
          <span id="wind" class="mono">calm</span>
        </div>
        <div class="storm-hp o">
          <span class="label">Guest <span id="guest-you"></span></span>
          <div class="storm-bar"><i id="guest-bar"></i></div>
          <span id="guest-hp" class="mono">100</span>
        </div>
      </div>
      <div id="board" class="card board storm" role="group"
        aria-label="Ridge">
        <canvas id="field" class="storm-field" aria-hidden="true"></canvas>
        <p id="waiting" class="storm-waiting mono muted" hidden>
          waiting for the host's ridge
        </p>
        <canvas
          id="code"
          class="board-code"
          aria-label="This move as a QR code; tap to see the ridge"
          hidden
        ></canvas>
      </div>
      <p id="desync" class="mono"
        hidden>desync: the two phones disagree on this game</p>
      <div id="aim" class="storm-aim">
        <div id="weapons" class="storm-weapons" role="group"
          aria-label="Weapon"></div>
        <label class="storm-slider">
          <span>Angle <strong id="angle-value" class="mono">45°</strong></span>
          <input id="angle" type="range" min="0" max="180" value="45"
            dir="rtl" />
        </label>
        <label class="storm-slider">
          <span>Power <strong id="power-value" class="mono">60</strong></span>
          <input id="power" type="range" min="0" max="100" value="60" />
        </label>
        <div class="storm-move">
          <button id="left" aria-label="Move left">&larr;</button>
          <span id="move-value" class="mono">move 0</span>
          <button id="right" aria-label="Move right">&rarr;</button>
          <button id="fire" class="tx">Fire</button>
        </div>
        <button id="ping" hidden disabled>Ping</button>
      </div>
      <div id="again" class="row" hidden>
        <button id="switch" class="tx">Switch sides</button>
        <button id="replay">Replay</button>
      </div>
    </div>
    <footer class="vf-foot">
      <details>
        <summary class="mono muted">Log</summary>
        <pre id="log" class="log"></pre>
      </details>
    </footer>
    <script type="module" src="./packetstorm.js"></script>
  </body>
</html>
