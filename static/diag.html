<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Airgap diagnostics</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1><a href="./">Airgap</a> diagnostics</h1>
      <p
        class="tagline">Send a test message between two devices by sound or QR.</p>
    </header>
    <main class="stack">
      <section class="card">
        <h2>Device</h2>
        <dl class="facts">
          <dt>Audio sample rate</dt>
          <dd id="sample-rate">–</dd>
          <dt>Codec worker</dt>
          <dd id="worker-state">not started</dd>
          <dt>Microphone</dt>
          <dd id="mic-state">not started</dd>
          <dt>Our session id</dt>
          <dd id="session-id">–</dd>
          <dt>Own messages ignored</dt>
          <dd id="self-suppressed">0</dd>
        </dl>
        <button id="start">Start</button>
      </section>

      <section class="card" id="send-card" hidden>
        <h2>Send</h2>
        <label>Message <input id="send-text" value="hello airgap" maxlength="800" /></label>
        <div class="row">
          <label>Via
            <select id="send-via">
              <option value="sound">Sound</option>
              <option value="qr">QR</option>
            </select>
          </label>
          <label>Protocol
            <select id="send-protocol">
              <option value="fastest">fastest</option>
              <option value="fast">fast</option>
              <option value="normal">normal</option>
              <option value="ultrasound-fastest">ultrasound fastest</option>
              <option value="ultrasound-fast">ultrasound fast</option>
              <option value="ultrasound-normal">ultrasound normal</option>
            </select>
          </label>
        </div>
        <p id="send-estimate" class="muted"></p>
        <div class="row">
          <button id="send">Send</button>
          <button id="send-stop" disabled>Stop</button>
        </div>
        <canvas id="qr-canvas" class="qr"></canvas>
      </section>

      <section class="card" id="receive-card" hidden>
        <h2>Receive</h2>
        <div class="row">
          <button id="listen">Listen</button>
          <button id="scan">Scan</button>
          <button id="receive-both">Both</button>
          <button id="exchange">Send + receive at once</button>
          <button id="receive-stop" disabled>Stop</button>
        </div>
        <div class="row">
          <label>Turns as
            <select id="turn-role">
              <option value="host">host (calls)</option>
              <option value="guest">guest (answers)</option>
            </select>
          </label>
          <label>Turnaround ms
            <input id="turnaround-ms" type="number" value="400" min="0" step="50" />
          </label>
          <label>Guard ms
            <input id="guard-ms" type="number" value="500" min="0" step="100" />
          </label>
          <button id="handshake">Handshake</button>
        </div>
        <p id="receive-progress" class="muted">idle</p>
        <p>Received: <strong id="received-text"></strong></p>
        <video id="camera" class="camera" hidden></video>
      </section>

      <section class="card">
        <h2>Log</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script type="module" src="./diag.js"></script>
  </body>
</html>
