<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Airgap diagnostics</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header compact">
      <h1><a href="./">Airgap</a><span class="label tx">Diagnostics</span></h1>
      <p
        class="tagline">Send a test message between two devices by sound or QR.</p>
    </header>
    <main class="stack">
      <section class="card">
        <div class="card-head">
          <h2>Device</h2>
          <span class="mono muted">standby</span>
        </div>
        <dl class="facts">
          <dt>Audio sample rate</dt>
          <dd id="sample-rate">–</dd>
          <dt>Codec worker</dt>
          <dd id="worker-state">not started</dd>
          <dt>Our session id</dt>
          <dd id="session-id">–</dd>
          <dt>Own messages ignored</dt>
          <dd id="self-suppressed">0</dd>
        </dl>
        <div class="row">
          <button id="mic" class="rx">Turn on mic</button>
          <button id="cam" class="rx">Turn on camera</button>
        </div>
      </section>

      <section class="card tx">
        <div class="card-head">
          <h2>Send</h2>
          <span class="mono muted">tx</span>
        </div>
        <label>Message <input id="send-text" value="hello airgap" maxlength="12" /></label>
        <canvas id="qr-canvas" class="qr"></canvas>
        <label>Sound protocol
          <select id="send-protocol">
            <option value="fastest">fastest</option>
            <option value="fast">fast</option>
            <option value="normal">normal</option>
            <option value="ultrasound-fastest">ultrasound fastest</option>
            <option value="ultrasound-fast">ultrasound fast</option>
            <option value="ultrasound-normal">ultrasound normal</option>
          </select>
        </label>
        <p id="send-estimate" class="mono muted"></p>
        <div class="row">
          <button id="play" class="tx">Play</button>
          <button id="play-stop" disabled>Stop</button>
        </div>
      </section>

      <section class="card rx">
        <div class="card-head">
          <h2>Receive</h2>
          <span class="mono muted">rx</span>
        </div>
        <div class="row">
          <button id="listen" class="rx">Listen</button>
          <button id="scan" class="rx">Scan</button>
          <button id="receive-both" class="ghost-rx">Both</button>
          <button id="receive-stop" disabled>Stop</button>
        </div>
        <div class="readout">
          <p id="receive-progress" class="status">idle</p>
          <p class="value">Received <strong id="received-text"></strong></p>
        </div>
        <video id="camera" class="camera" hidden></video>
        <button id="flip" class="ghost-rx camera-flip" hidden>⇄ Flip</button>
      </section>

      <form class="card" action="./handshake.html" method="get">
        <div class="card-head">
          <h2>Handshake</h2>
          <span class="mono muted">opens the exchange screen</span>
        </div>
        <label>Message <input name="text" value="hello airgap" maxlength="12" /></label>
        <div class="row">
          <label>Via
            <select name="via">
              <option value="both">sound + QR</option>
              <option value="sound">sound</option>
              <option value="qr">QR</option>
            </select>
          </label>
          <label>Turns as
            <select name="role">
              <option value="host">host (calls)</option>
              <option value="guest">guest (answers)</option>
            </select>
          </label>
          <label>Sound protocol
            <select name="protocol">
              <option value="fastest">fastest</option>
              <option value="fast">fast</option>
              <option value="normal">normal</option>
              <option value="ultrasound-fastest">ultrasound fastest</option>
              <option value="ultrasound-fast">ultrasound fast</option>
              <option value="ultrasound-normal">ultrasound normal</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Turnaround ms
            <input name="turnaround" type="number" inputmode="numeric" pattern="[0-9]*" value="50" min="0" step="10" />
          </label>
          <label>Guard ms
            <input name="guard" type="number" inputmode="numeric" pattern="[0-9]*" value="100" min="0" step="10" />
          </label>
          <label>Retries
            <input name="retries" type="number" inputmode="numeric" pattern="[0-9]*" value="5" min="1" step="1" />
          </label>
        </div>
        <div class="row">
          <button class="tx" type="submit">Handshake</button>
        </div>
      </form>

      <section class="card">
        <div class="card-head">
          <h2>Log</h2>
          <span class="mono muted">utc</span>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script type="module" src="./diag.js"></script>
  </body>
</html>
