<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Airgap chess</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="viewfinder">
    <video id="camera" class="camera" hidden></video>
    <svg hidden aria-hidden="true">
      <symbol id="piece-k" viewBox="0 0 24 24">
        <path fill="currentColor" d="M11 2h2v2h2v2h-2v2h-2V6H9V4h2z" />
        <path fill="currentColor" d="M11 7h2v5h-2z" />
        <path fill="currentColor"
          d="M7 16C5 12 5 9.5 6.5 8.5c1.5-1 3.5 0 5.5 3 2-3 4-4 5.5-3 1.5 1 1.5 3.5-.5 7.5z" />
        <path fill="currentColor" d="M7 16h10l.8 2.5H6.2z" />
        <path fill="currentColor" d="M5 18.5h14V21H5z" />
      </symbol>
      <symbol id="piece-q" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M7.5 16L5 8l3 3.5.7-6 2 5L12 4.5l1.3 6 2-5 .7 6 3-3.5-2.5 8z" />
        <path fill="currentColor"
          d="M3.8 8a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0z" />
        <path fill="currentColor"
          d="M7.5 5.5a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0z" />
        <path fill="currentColor"
          d="M10.8 4.5a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0z" />
        <path fill="currentColor"
          d="M14.1 5.5a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0z" />
        <path fill="currentColor"
          d="M17.8 8a1.2 1.2 0 1 0 2.4 0 1.2 1.2 0 1 0-2.4 0z" />
        <path fill="currentColor" d="M7 16h10l.8 2.5H6.2z" />
        <path fill="currentColor" d="M5 18.5h14V21H5z" />
      </symbol>
      <symbol id="piece-r" viewBox="0 0 24 24">
        <path fill="currentColor" d="M6 3h3v2.5h2V3h2v2.5h2V3h3v5H6z" />
        <path fill="currentColor" d="M8 8h8l-.8 9H8.8z" />
        <path fill="currentColor" d="M5.5 17h13v4h-13z" />
      </symbol>
      <symbol id="piece-b" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M10.6 3a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0z" />
        <path fill="currentColor"
          d="M12 3.5c2.8 2.2 4.5 5 4.5 8 0 1.8-.7 3.3-1.8 4.3H9.3C8.2 14.8 7.5 13.3 7.5 11.5c0-3 1.7-5.8 4.5-8z" />
        <path fill="currentColor" d="M9.5 15.3h5l1 2.7h-7z" />
        <path fill="currentColor" d="M5.5 18h13v3h-13z" />
      </symbol>
      <symbol id="piece-n" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M7 21v-2.5c0-2.5 1.2-4 2.6-5.3L8.4 12.5c-1.2.5-2.2.2-2.8-.6l-.9-1.3c-.3-.4-.2-.9.2-1.2L8.6 7l.6-3.2 2 1.6c.6-.2 1.2-.3 1.8-.3 3.6 0 6 3.4 6 8.4V21z" />
        <path fill="currentColor" d="M5 19h14v2H5z" />
      </symbol>
      <symbol id="piece-p" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M9.25 6.25a2.75 2.75 0 1 0 5.5 0 2.75 2.75 0 1 0-5.5 0z" />
        <path fill="currentColor" d="M9 9.5h6v1.5H9z" />
        <path fill="currentColor"
          d="M12 10.5c-2.3 0-4 1.8-4 4 0 1.4.7 2.6 1.7 3.3L8 19h8l-1.7-1.2c1-.7 1.7-1.9 1.7-3.3 0-2.2-1.7-4-4-4z" />
        <path fill="currentColor" d="M5.5 19h13v2h-13z" />
      </symbol>
    </svg>
    <header class="vf-head">
      <h1><a href="./">Airgap</a></h1>
      <details id="menu" class="vf-menu">
        <summary class="vf-gear" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </summary>
        <div id="settings" class="card vf-settings">
          <span class="label">Send moves by</span>
          <label class="check"><input id="chirp" type="checkbox" checked />
        chirp</label>
          <label class="check"><input id="qrcode" type="checkbox" />
        qrcode</label>
          <label>Chirp protocol
        <select id="protocol">
          <option value="ultrasound-fastest">ultrasound fastest</option>
          <option value="ultrasound-fast">ultrasound fast</option>
          <option value="ultrasound-normal">ultrasound normal</option>
          <option value="fastest">fastest</option>
          <option value="fast">fast</option>
          <option value="normal">normal</option>
        </select>
      </label>
          <label>Chirp passes per move
        <input
          id="passes"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          min="1"
          max="20"
          value="1"
        />
      </label>
        </div>
      </details>
    </header>
    <div class="vf-status vf-top">
      <span id="dot" class="dot"></span>
      <span id="status" class="mono">ready</span>
    </div>
    <div class="vf-middle">
      <button id="start" class="tx">Start</button>
      <div id="board" class="card board chess" role="group"
        aria-label="Board">
        <canvas
          id="code"
          class="board-code"
          aria-label="This move as a QR code; tap to see the board"
          hidden
        ></canvas>
      </div>
      <button id="ping" hidden disabled>Ping</button>
      <div id="again" class="row" hidden>
        <button id="switch" class="tx">Switch colours</button>
        <button id="replay">Replay</button>
      </div>
    </div>
    <footer class="vf-foot">
      <details>
        <summary class="mono muted">Log</summary>
        <pre id="log" class="log"></pre>
      </details>
    </footer>
    <script type="module" src="./chess.js"></script>
  </body>
</html>
