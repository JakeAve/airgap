name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        # Pinned: deno bundle in 2.9.7 fetches esbuild's platform binary
        # and then looks for it at the wrong path, failing every build.
        with:
          deno-version: v2.9.6
      - run: deno task check
      - run: deno task test
      - run: deno task build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        # Pinned: deno bundle in 2.9.7 fetches esbuild's platform binary
        # and then looks for it at the wrong path, failing every build.
        with:
          deno-version: v2.9.6
      - run: deno install
      - run: deno run -A npm:playwright install --with-deps chromium
      - run: deno task e2e
